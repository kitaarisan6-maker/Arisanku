<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>ArisanKu</title>
  
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#2563eb">

  <style>
    body, html { 
      margin: 0; padding: 0; height: 100%; overflow: hidden; background-color: #f9fafb; 
    }
    /* Trik menyembunyikan banner Google Apps Script */
    .app-container {
      position: absolute;
      top: -30px; /* Menggeser iframe ke atas sejauh 30px */
      left: 0;
      width: 100%;
      height: calc(100% + 30px); /* Menambah tinggi agar bawahnya tidak terpotong */
    }
    iframe { 
      width: 100%; height: 100%; border: none; 
    }
  </style>
</head>
<body>

  <div class="app-container">
    <iframe src="https://script.google.com/macros/s/AKfycbw74_ZhtR_Ho9kzWZIoUjqtW-YC77uwU2oW3EEl8Jx3T2BHoz66voRWMPNOMgqnSVCD/exec"></iframe>
  </div>

  <script>
    // Mendaftarkan Service Worker agar muncul tombol "Install App" di HP
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('sw.js')
        .then(() => console.log('Service Worker Registered'));
    }
  </script>

</body>
</html>
