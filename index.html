<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>ArisanKu</title>
  
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#ffffff">

  <style>
    body, html { 
      margin: 0; padding: 0; height: 100%; overflow: hidden; background-color: #ffffff; 
    }
    
    /* 1. Mendorong area aplikasi ke bawah agar tidak tertutup Jam/Baterai HP */
    .safe-area {
      height: 100%;
      width: 100%;
      padding-top: env(safe-area-inset-top, 38px); /* Jarak aman untuk Status Bar Android/iOS */
      box-sizing: border-box;
    }
    
    /* 2. Wadah bingkai pemotong banner */
    .iframe-container {
      width: 100%;
      height: 100%;
      overflow: hidden; 
      position: relative;
    }
    
    /* 3. Menarik iframe ke atas persis setinggi banner Google (28px) */
    iframe { 
      position: absolute;
      top: -28px; 
      left: 0;
      width: 100%; 
      height: calc(100% + 28px); 
      border: none; 
    }
  </style>
</head>
<body>

  <div class="safe-area">
    <div class="iframe-container">
      <iframe src="https://script.google.com/macros/s/AKfycbw74_ZhtR_Ho9kzWZIoUjqtW-YC77uwU2oW3EEl8Jx3T2BHoz66voRWMPNOMgqnSVCD/exec"></iframe>
    </div>
  </div>

  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('sw.js');
    }
  </script>

</body>
</html>
