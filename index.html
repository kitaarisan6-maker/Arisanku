<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>ArisanKu</title>
  
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#ffffff">

  <style>
    body, html { 
      margin: 0; padding: 0; height: 100%; background: #ffffff; overflow: hidden; 
    }
    
    /* 1. Pembungkus utama untuk memberi jarak tipis bagi Jam/Baterai HP */
    .app-wrapper {
      position: relative; 
      width: 100%; 
      height: 100%;
      padding-top: env(safe-area-inset-top, 12px); /* Jarak natural 12px */
      box-sizing: border-box;
    }

    /* 2. Area khusus untuk memotong banner Google */
    .iframe-cut {
      position: relative; 
      width: 100%; 
      height: 100%; 
      overflow: hidden; 
    }

    /* 3. Menarik iframe ke atas sejauh 28px (setinggi banner) */
    iframe {
      position: absolute; 
      top: -28px; 
      left: 0; 
      width: 100%; 
      height: calc(100% + 28px); 
      border: none; 
    }
  </style>
</head>
<body>

  <div class="app-wrapper">
    <div class="iframe-cut">
      <!-- Link web app kamu -->
      <iframe src="https://script.google.com/macros/s/AKfycbw74_ZhtR_Ho9kzWZIoUjqtW-YC77uwU2oW3EEl8Jx3T2BHoz66voRWMPNOMgqnSVCD/exec"></iframe>
    </div>
  </div>

  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('sw.js');
    }
  </script>

</body>
</html>
